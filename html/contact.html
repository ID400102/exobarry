<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore - Contact</title>
    <link rel="stylesheet" href="contact.css">
    <!-- Lien vers Font Awesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <section class="contact-section">
        <h1>Envoyez-nous un message</h1>

        <div class="contact-container">
            <!-- Formulaire de contact à droite -->
            <form class="contact-form">
                <label for="fullname">Nom complet</label>
                <input type="text" id="fullname" name="fullname" placeholder="Votre nom">

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="votre@email.com">

                <label for="subject">Sujet</label>
                <input type="text" id="subject" name="subject" placeholder="Sujet de votre message">

                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="Votre message ici..." rows="5"></textarea>

                <button type="submit">Envoyer</button>
            </form>

            <!-- Coordonnées à gauche -->
            <div class="contact-info">
                <h2>Nos Coordonnées</h2>

                <!-- Bloc Adresse -->
                <section class="contact-detail address">
                    <i class="fas fa-map-marker-alt"></i>
                    <div>
                        <strong>Adresse :</strong>
                        <p>123 Avenue de la Tech, 75001 Paris, France</p>
                    </div>
                </section>

                <!-- Bloc Téléphone -->
                <section class="contact-detail phone">
                    <i class="fas fa-phone-alt"></i>
                    <div>
                        <strong>Téléphone :</strong>
                        <p>+33 1 23 45 67 89</p>
                    </div>
                </section>

                <!-- Bloc Email -->
                <section class="contact-detail email">
                    <i class="fas fa-envelope"></i>
                    <div>
                        <strong>Email :</strong>
                        <p>contact@example.com</p>
                    </div>
                </section>

                <!-- Bloc Horaires -->
                <section class="contact-detail hours">
                    <i class="fas fa-clock"></i>
                    <div>
                        <strong>Horaires :</strong>
                        <p>Lun – Ven : 9h – 18h<br>Sam : 10h – 16h</p>
                    </div>
                </section>

            </div>

        </div>
    </section>

    <footer class="contact-footer">
        <p>© 2026 – Tous droits réservés</p>
    </footer>

</body>
</html>
